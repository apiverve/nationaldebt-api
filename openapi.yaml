openapi: 3.0.4
info:
  title: National Debt
  description: >-
    National Debt provides the US national debt (Debt to the Penny), updated
    daily from the Treasury. It returns the total public debt, debt held by the
    public, intragovernmental holdings, per-capita debt calculations, the
    previous record's total, and on paid plans how much the debt grew over a
    day, 30 days and a year.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/nationaldebt:
    get:
      summary: National Debt
      description: >-
        Get current or historical US national debt data, with growth over 1 day,
        30 days and 1 year
      operationId: nationaldebt
      parameters:
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional date in YYYY-MM-DD format for historical lookup. Omit for
            current data.
          example: '2023-06-15'
        - name: changes
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the previous record's total and the growth over 1 day, 30
            days and 1 year
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  date: '2026-10-26'
                  recordDate: '2026-10-26'
                  totalDebt: 40528358939415.85
                  totalDebtFormatted: $40.53 trillion
                  publicDebt: 32635294814294.48
                  publicDebtFormatted: $32.64 trillion
                  intragovernmentalDebt: 7893064125121.37
                  intragovernmentalDebtFormatted: $7.89 trillion
                  perCapita: 120980
                  perCapitaFormatted: $120,980
                  population: 335000000
                  publicDebtRatio: 80.52
                  perHousehold: 302450.44
                  perHouseholdFormatted: $302,450
                  previousDebt: 40463151897249.19
                  previousDate: '2026-10-23'
                  change1d: 65207042166.66
                  change30d: 431180819664.95
                  change1y: 2519332979958.45
                  changePercent1y: 6.6282
                  averageDailyChange30d: 13909058698.87
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
